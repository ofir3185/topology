name: Build Network Topology DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source.part*" | Sort-Object Name
          if (-not $parts) { throw "No source chunks found" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive source.zip -DestinationPath work -Force

      - name: Apply v0.2 fixes
        shell: pwsh
        run: |
          $view = "work\NetworkTopology-mscp\Client\NetworkTopologyView.xaml.cs"
          $text = Get-Content $view -Raw
          $text = $text.Replace("Path.GetDirectoryName", "System.IO.Path.GetDirectoryName")
          $text = $text.Replace("Path.Combine", "System.IO.Path.Combine")
          Set-Content $view $text -Encoding UTF8

          Copy-Item "patches\DeviceDiscoveryService.cs" "work\NetworkTopology-mscp\Services\DeviceDiscoveryService.cs" -Force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build
        shell: pwsh
        run: |
          msbuild "work\NetworkTopology-mscp\NetworkTopology.csproj" /restore /p:Configuration=Release /p:Platform=AnyCPU /p:CIBuild=true /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare replacement DLL
        shell: pwsh
        run: |
          $build = "work\NetworkTopology-mscp\bin\Release\net48"
          Copy-Item (Join-Path $build "NetworkTopology.dll") "NetworkTopology.dll" -Force

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: NetworkTopology-DLL-v0.2
          path: NetworkTopology.dll
          retention-days: 14
