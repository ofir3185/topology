name: Build Network Topology DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source.part*" | Sort-Object Name
          if (-not $parts) { throw "No source chunks found" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive source.zip -DestinationPath work -Force

      - name: Apply v0.2 camera discovery fix
        shell: pwsh
        run: |
          $view = "work\NetworkTopology-mscp\Client\NetworkTopologyView.xaml.cs"
          $text = Get-Content $view -Raw
          $text = $text.Replace("Path.GetDirectoryName", "System.IO.Path.GetDirectoryName")
          $text = $text.Replace("Path.Combine", "System.IO.Path.Combine")
          Set-Content $view $text -Encoding UTF8

          $discovery = @'
using System;
using System.Collections.Generic;
using System.IO;
using System.Linq;
using NetworkTopology.Models;
using VideoOS.Platform;
using VideoOS.Platform.ConfigurationItems;

namespace NetworkTopology.Services
{
    internal static class DeviceDiscoveryService
    {
        private static readonly string LogFile = Path.Combine(
            Environment.GetFolderPath(Environment.SpecialFolder.CommonApplicationData),
            "Megalcom", "NetworkTopology", "discovery.log");

        public static List<CameraDevice> DiscoverCameras()
        {
            var cameras = new Dictionary<Guid, CameraDevice>();

            Log("=== Discovery start ===");

            TryDiscoverFromRecordingServers(cameras);
            Log("After RecordingServer/Hardware discovery: " + cameras.Count);

            TryDiscoverFromCameraGroups(cameras);
            Log("After CameraGroup discovery: " + cameras.Count);

            TryDiscoverFromItemTree(cameras);
            Log("After Smart Client camera tree discovery: " + cameras.Count);

            var result = cameras.Values
                .OrderBy(x => x.CameraName ?? string.Empty, StringComparer.CurrentCultureIgnoreCase)
                .ToList();

            Log("Discovery completed. Cameras=" + result.Count);
            return result;
        }

        private static void TryDiscoverFromRecordingServers(Dictionary<Guid, CameraDevice> cameras)
        {
            try
            {
                var master = EnvironmentManager.Instance.MasterSite;
                if (master == null)
                {
                    Log("RecordingServer discovery: MasterSite is null");
                    return;
                }

                var management = new ManagementServer(master);
                int recorderCount = 0;
                int hardwareCount = 0;
                int cameraCount = 0;

                foreach (var rs in management.RecordingServerFolder.RecordingServers)
                {
                    if (rs == null) continue;

                    try
                    {
                        recorderCount++;
                        foreach (var hw in rs.HardwareFolder.Hardwares)
                        {
                            if (hw == null || !hw.Enabled)
                                continue;

                            hardwareCount++;
                            string host = ExtractHost(hw.Address);

                            foreach (var cam in hw.CameraFolder.Cameras)
                            {
                                if (cam == null || !cam.Enabled)
                                    continue;

                                Guid id;
                                if (!Guid.TryParse(cam.Id, out id))
                                    continue;

                                cameraCount++;

                                CameraDevice device;
                                if (!cameras.TryGetValue(id, out device))
                                {
                                    device = new CameraDevice
                                    {
                                        CameraId = id,
                                        State = NodeState.Unknown
                                    };
                                    cameras[id] = device;
                                }

                                device.CameraName = First(device.CameraName, cam.Name);
                                device.HardwareName = First(device.HardwareName, hw.Name);
                                device.Address = First(device.Address, hw.Address);
                                device.IpAddress = First(device.IpAddress, host);
                                device.Model = First(device.Model, hw.Model);
                                device.RecordingServerName = First(device.RecordingServerName, rs.Name);
                                device.HardwarePath = First(device.HardwarePath, hw.Path);
                            }
                        }
                    }
                    catch (Exception ex)
                    {
                        Log("RecordingServer '" + SafeName(rs) + "' failed: " + Flatten(ex));
                    }
                }

                Log("RecordingServer discovery detail: recorders=" + recorderCount +
                    ", hardware=" + hardwareCount + ", cameras=" + cameraCount);
            }
            catch (Exception ex)
            {
                Log("RecordingServer discovery failed: " + Flatten(ex));
            }
        }

        private static void TryDiscoverFromCameraGroups(Dictionary<Guid, CameraDevice> cameras)
        {
            try
            {
                var master = EnvironmentManager.Instance.MasterSite;
                if (master == null)
                {
                    Log("CameraGroup discovery: MasterSite is null");
                    return;
                }

                var management = new ManagementServer(master);
                var serverId = master.ServerId;
                int count = 0;

                foreach (var group in management.CameraGroupFolder.CameraGroups)
                    CollectCameraGroup(group, serverId, cameras, ref count, 0);

                Log("CameraGroup discovery detail: cameras=" + count);
            }
            catch (Exception ex)
            {
                Log("CameraGroup discovery failed: " + Flatten(ex));
            }
        }

        private static void CollectCameraGroup(
            CameraGroup group,
            ServerId serverId,
            Dictionary<Guid, CameraDevice> cameras,
            ref int count,
            int depth)
        {
            if (group == null || depth > 32)
                return;

            try
            {
                foreach (var cam in group.CameraFolder.Cameras)
                {
                    if (cam == null || !cam.Enabled)
                        continue;

                    Guid id;
                    if (!Guid.TryParse(cam.Id, out id))
                        continue;

                    count++;

                    CameraDevice device;
                    if (!cameras.TryGetValue(id, out device))
                    {
                        device = new CameraDevice
                        {
                            CameraId = id,
                            State = NodeState.Unknown
                        };
                        cameras[id] = device;
                    }

                    device.CameraName = First(device.CameraName, cam.Name);

                    try
                    {
                        var item = Configuration.Instance.GetItem(serverId, id, Kind.Camera);
                        EnrichFromItem(device, item);
                    }
                    catch (Exception ex)
                    {
                        Log("GetItem for camera '" + cam.Name + "' failed: " + Flatten(ex));
                    }
                }

                foreach (var child in group.CameraGroupFolder.CameraGroups)
                    CollectCameraGroup(child, serverId, cameras, ref count, depth + 1);
            }
            catch (Exception ex)
            {
                Log("CameraGroup '" + SafeName(group) + "' failed: " + Flatten(ex));
            }
        }

        private static void TryDiscoverFromItemTree(Dictionary<Guid, CameraDevice> cameras)
        {
            List<Item> roots = null;

            try
            {
                roots = Configuration.Instance.GetItemsByKind(Kind.Camera, ItemHierarchy.SystemDefined);
                Log("SystemDefined camera roots: " + (roots == null ? 0 : roots.Count));
            }
            catch (Exception ex)
            {
                Log("GetItemsByKind(SystemDefined) failed: " + Flatten(ex));
            }

            if (roots == null || roots.Count == 0)
            {
                try
                {
                    roots = Configuration.Instance.GetItemsByKind(Kind.Camera);
                    Log("Default camera roots: " + (roots == null ? 0 : roots.Count));
                }
                catch (Exception ex)
                {
                    Log("GetItemsByKind(default) failed: " + Flatten(ex));
                }
            }

            if (roots == null)
                return;

            var visitedFolders = new HashSet<Guid>();
            var stack = new Stack<KeyValuePair<Item, int>>();

            foreach (var root in roots)
                if (root != null)
                    stack.Push(new KeyValuePair<Item, int>(root, 0));

            int leaves = 0;

            while (stack.Count > 0)
            {
                var pair = stack.Pop();
                var item = pair.Key;
                var depth = pair.Value;

                if (item == null || item.FQID == null || depth > 32)
                    continue;

                if (item.FQID.FolderType == FolderType.No)
                {
                    if (item.FQID.Kind != Kind.Camera)
                        continue;

                    bool enabled = true;
                    try { enabled = item.Enabled; } catch { }
                    if (!enabled)
                        continue;

                    leaves++;
                    Guid id = item.FQID.ObjectId;

                    CameraDevice device;
                    if (!cameras.TryGetValue(id, out device))
                    {
                        device = new CameraDevice
                        {
                            CameraId = id,
                            State = NodeState.Unknown
                        };
                        cameras[id] = device;
                    }

                    EnrichFromItem(device, item);
                    continue;
                }

                if (!visitedFolders.Add(item.FQID.ObjectId))
                    continue;

                try
                {
                    var children = item.GetChildren();
                    if (children != null)
                    {
                        foreach (var child in children)
                            if (child != null)
                                stack.Push(new KeyValuePair<Item, int>(child, depth + 1));
                    }
                }
                catch (Exception ex)
                {
                    Log("GetChildren '" + item.Name + "' failed: " + Flatten(ex));
                }
            }

            Log("Item tree leaves found: " + leaves);
        }

        private static void EnrichFromItem(CameraDevice device, Item item)
        {
            if (device == null || item == null)
                return;

            device.CameraName = First(device.CameraName, item.Name);

            try
            {
                if (string.IsNullOrWhiteSpace(device.RecordingServerName) &&
                    item.FQID != null &&
                    item.FQID.ServerId != null)
                {
                    device.RecordingServerName = item.FQID.ServerId.ServerHostname;
                }
            }
            catch { }

            try
            {
                if (item.Properties != null)
                {
                    string value;

                    if (string.IsNullOrWhiteSpace(device.Address) &&
                        item.Properties.TryGetValue(ItemProperties.Address, out value) &&
                        !string.IsNullOrWhiteSpace(value))
                    {
                        device.Address = value;
                    }

                    if (string.IsNullOrWhiteSpace(device.Address) &&
                        item.Properties.TryGetValue(ItemProperties.ConfigurationUrl, out value) &&
                        !string.IsNullOrWhiteSpace(value))
                    {
                        device.Address = value;
                    }
                }
            }
            catch (Exception ex)
            {
                Log("Item properties failed for '" + item.Name + "': " + Flatten(ex));
            }

            if (string.IsNullOrWhiteSpace(device.IpAddress))
                device.IpAddress = ExtractHost(device.Address);
        }

        private static string ExtractHost(string address)
        {
            if (string.IsNullOrWhiteSpace(address))
                return string.Empty;

            try
            {
                Uri uri;
                if (Uri.TryCreate(address, UriKind.Absolute, out uri))
                    return uri.Host;

                if (Uri.TryCreate("http://" + address, UriKind.Absolute, out uri))
                    return uri.Host;
            }
            catch { }

            var slash = address.IndexOf('/');
            if (slash > 0)
                address = address.Substring(0, slash);

            var colon = address.IndexOf(':');
            if (colon > 0)
                address = address.Substring(0, colon);

            return address.Trim();
        }

        private static string First(string current, string candidate)
        {
            return string.IsNullOrWhiteSpace(current) ? (candidate ?? string.Empty) : current;
        }

        private static string SafeName(object value)
        {
            try
            {
                var p = value.GetType().GetProperty("Name");
                return p == null ? "?" : Convert.ToString(p.GetValue(value, null));
            }
            catch { return "?"; }
        }

        private static string Flatten(Exception ex)
        {
            if (ex == null) return string.Empty;
            var text = ex.GetType().Name + ": " + ex.Message;
            if (ex.InnerException != null)
                text += " -> " + ex.InnerException.GetType().Name + ": " + ex.InnerException.Message;
            return text;
        }

        private static void Log(string message)
        {
            try
            {
                var dir = Path.GetDirectoryName(LogFile);
                if (!Directory.Exists(dir))
                    Directory.CreateDirectory(dir);

                File.AppendAllText(
                    LogFile,
                    DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss.fff") + "  " + message + Environment.NewLine);
            }
            catch
            {
            }
        }
    }
}

'@
          Set-Content "work\NetworkTopology-mscp\Services\DeviceDiscoveryService.cs" $discovery -Encoding UTF8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build
        shell: pwsh
        run: |
          msbuild "work\NetworkTopology-mscp\NetworkTopology.csproj" /restore /p:Configuration=Release /p:Platform=AnyCPU /p:CIBuild=true /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare replacement DLL
        shell: pwsh
        run: |
          $build = "work\NetworkTopology-mscp\bin\Release\net48"
          Copy-Item (Join-Path $build "NetworkTopology.dll") "NetworkTopology.dll" -Force

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: NetworkTopology-DLL-v0.2
          path: NetworkTopology.dll
          retention-days: 14
